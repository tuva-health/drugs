version: 2
sources:
  - name: coderx_enterprise
    description: >-
      User-managed licensed CodeRx in the same fixed schema used by Tuva Core.
      The three base relations are required only in Enterprise mode. Extra
      fields and the ingredients relation are optional enrichments.
    database: "{{ var('drugs_coderx_database', target.database) }}"
    schema: "{{ var('drugs_coderx_schema', 'coderx') }}"
    tables:
      - name: packages
      - name: drugs
      - name: classes
      - name: ingredients
