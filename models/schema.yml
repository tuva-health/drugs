version: 2
models:
- name: drugs__medication
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Claims-derived Core medication with payer-paid and CodeRx enrichment;
    one row per source/medication. Invalid durations remain with an exposure status.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
        - medication_id
  columns:
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
    data_tests:
    - not_null
  - name: medication_id
    description: "Core medication identifier, joined to pharmacy claims by medication ID, patient and source."
    data_tests:
    - not_null
  - name: enterprise_drug_details_enabled_flag
    description: 1 when Enterprise drug detail columns are available and enabled.
  - name: enterprise_marketing_enabled_flag
    description: 1 when Enterprise package marketing columns are available and enabled.
  - name: marketing_screening_applied_flag
    description: 1 when enabled marketing columns and a nonempty category are available for downstream screening. This medication-level flag does not confirm the product passed current-candidate checks.
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
  - name: ndc_code
    description: "Package-level NDC used to link the claims-derived Core medication to CodeRx."
  - name: drug_id
    description: "CodeRx drug concept identifier for the mapped NDC; not necessarily an atomic ingredient."
  - name: clinical_drug_id
    description: "CodeRx clinical product identifier used for brand/generic comparisons at the same ingredient, strength and form."
  - name: days_supply
    description: "Dispensed days supply from Core. Missing or invalid duration does not create estimated exposure."
  - name: paid_amount
    description: "Payer-paid pharmacy claim amount. Allowed, billed and patient cost-sharing amounts are not used for savings."
  - name: exposure_status
    description: "Whether the claim has usable nonfuture dispensing and duration data. Unknown or invalid rows remain visible but do not create supply."
  - name: file_date
    description: "Pharmacy source-file date retained separately from ingest_datetime."
  - name: ingest_datetime
    description: "Pharmacy ingestion timestamp; does not replace an available source-file date for freshness."
- name: drugs__drug_episode
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Enterprise-only source/person/atomic RxNorm ingredient episodes,
    independent of strength, form and brand. Combination fills contribute to
    each ingredient. The table retains its columns but is empty under Open.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - episode_id
  columns:
  - name: episode_id
    description: "Deterministic key from source, patient, ingredient and observed episode start date."
    data_tests:
    - not_null
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
    data_tests:
    - not_null
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
    data_tests:
    - not_null
  - name: drug_code
    description: "Atomic RxNorm ingredient (IN) concept code. Combination products contribute one episode stream per ingredient."
    data_tests:
    - not_null
  - name: drug_name
    description: "Name of the atomic RxNorm ingredient, independent of strength, dosage form and brand."
    data_tests:
    - not_null
  - name: start_date
    description: "Inclusive first observed supply day in the ingredient episode; not proof of original treatment initiation."
    data_tests:
    - not_null
  - name: end_date
    description: "Inclusive last estimated supply day. The permissible gap is never appended to this date."
    data_tests:
    - not_null
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: drug_code_system
    description: "RxNorm for ingredient episode codes."
  - name: fill_count
    description: "Number of ingredient-level contributing fills in this episode. Combination fills can contribute to multiple ingredient episodes."
  - name: distinct_fill_dates
    description: "Distinct dispensing dates among contributing fills."
  - name: permissible_gap_days
    description: "Maximum uncovered days allowed between supply intervals before starting a new episode; default 30."
  - name: episode_span_days
    description: "Inclusive calendar days between episode start and end, including uncovered days tolerated for continuity."
  - name: covered_days
    description: "Unioned days of estimated supply in the episode; overlapping fills are not double counted."
  - name: uncovered_days
    description: "Episode span minus covered days. Continuity tolerance does not turn these days into covered supply."
  - name: active_supply_flag
    description: "1 only when an actual estimated fill interval covers assessment_date. Being within an episode grace period is insufficient."
  - name: restart_flag
    description: "1 for an observed episode after the first ingredient episode for this source and patient; not a confirmed clinical restart."
  - name: episode_end_status
    description: "Describes supply relative to the assessment date. no_later_supply_observed is not confirmed discontinuation."
- name: drugs__condition_evidence
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Enterprise-only unresolved recent Tuva-grouper diagnoses for the
    seven configured conditions, including claim provenance. Empty under Open.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
        - condition_id
  columns:
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
    data_tests:
    - not_null
  - name: condition_id
    description: "Core condition record identifier, retained for patient-level evidence review."
    data_tests:
    - not_null
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
  - name: claim_id
    description: "Claim identifier used with source and patient to recover diagnosis provenance from Core medical claims."
  - name: condition_name
    description: "Exact Tuva condition grouper label matched to the versioned condition rules."
  - name: condition_family
    description: "Tuva condition grouper family carried from Core."
  - name: condition_date
    description: "Core recorded_date, falling back to onset_date; must be within the configured lookback and not in the future."
  - name: resolved_date
    description: "Condition resolution date; records resolved on or before assessment_date do not qualify."
  - name: diagnosis_code
    description: "Normalized Core diagnosis code, falling back to source_code."
  - name: file_date
    description: "Linked medical-claim source-file date, where available."
  - name: ingest_datetime
    description: "Condition ingestion timestamp, falling back to the linked medical-claim timestamp."
  - name: freshness_lineage
    description: "Identifies direct Core condition ingestion evidence, recovered medical-claim lineage, or unavailable provenance."
- name: drugs__source_freshness
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Latest observed pharmacy file, ingest and service dates per source.
    Not a certified claims completion date.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
  columns:
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
    data_tests:
    - not_null
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: source_rx_file_date
    description: "Latest observed pharmacy source-file date for this source."
  - name: source_rx_ingest_datetime
    description: "Latest pharmacy ingestion timestamp, retained separately from file date."
  - name: source_latest_fill_date
    description: "Latest dispensing date on or before assessment_date; not a certified claims-complete-through date."
  - name: source_rx_freshness_date
    description: "Latest observed pharmacy file date for this source, falling back to ingestion date. A recent reload does not replace an available older file date."
  - name: source_rx_freshness_basis
    description: "file_date, ingest_datetime, or unavailable; identifies the displayed freshness evidence."
- name: drugs__patient_context
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Source-scoped patient context, enrollment and record/source freshness
    for worklist interpretation.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
        - person_id
  columns:
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
    data_tests:
    - not_null
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
    data_tests:
    - not_null
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: patient_rx_freshness_date
    description: "Latest observed patient pharmacy file date, falling back to ingestion date when no file date is available. Does not certify a complete claims feed."
  - name: source_rx_freshness_date
    description: "Latest observed pharmacy file date for this source, falling back to ingestion date. A recent reload does not replace an available older file date."
  - name: source_clinical_lag_days
    description: "Days from the latest nonfuture dispensing observed in the source to the assessment date; independent of file ingestion time."
  - name: outreach_readiness_status
    description: "Review context for death, unconfirmed enrollment, missing or future source freshness, and lagged data. current_record_review is not confirmation of medication use or feed completeness."
  - name: deceased_flag
    description: "1 when Core indicates death or a death date on or before assessment_date. Known deceased patients are excluded from worklists."
  - name: currently_enrolled_flag
    description: "1 when an eligibility interval covers assessment_date. Otherwise outreach requires enrollment confirmation."
  - name: patient_rx_age_days
    description: "Days between patient pharmacy freshness and assessment_date."
  - name: source_rx_age_days
    description: "Days between source pharmacy freshness and assessment_date."
- name: drugs__medication_condition
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Enterprise-only medication-to-condition evidence from versioned
    CodeRx ATC and exact ingredient rules. Not the actual prescribing indication.
    The table retains its columns but is empty under Open.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
        - medication_id
        - condition_code
  columns:
  - name: data_source
    data_tests:
    - not_null
  - name: medication_id
    data_tests:
    - not_null
  - name: condition_code
    data_tests:
    - not_null
- name: drugs__condition_status
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Enterprise-only current assessment per source/person/condition.
    Nullable flags preserve unknown exposure. The table is empty under Open;
    consult terminology_status before interpreting absence of rows.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - condition_status_id
  columns:
  - name: condition_status_id
    description: "Unique source, patient and condition assessment key; shared with the gap and refill worklists."
    data_tests:
    - not_null
  - name: active_condition_supply_flag
    description: 1 when usable current supply exists for any treatment related to
      the condition, including respiratory rescue medication.
  - name: active_maintenance_supply_flag
    description: 1 when usable current supply exists for a refill-eligible maintenance
      treatment. Rescue-only supply does not suppress an overdue maintenance refill.
  - name: latest_maintenance_medication_id
    description: Medication ID for the usable maintenance fill whose supply end
      determines the estimated refill due date, not necessarily the latest dispensing.
  - name: latest_maintenance_drug_name
    description: Drug name associated with latest_maintenance_medication_id.
  - name: open_drug_gap_flag
    description: 1 = review candidate, 0 = not flagged, null = unable to assess.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 0
          - 1
          quote: false
  - name: needs_refill_flag
    description: 1 = review candidate, 0 = not flagged, null = unable to assess.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 0
          - 1
          quote: false
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: patient_rx_freshness_date
    description: "Latest observed patient pharmacy file date, falling back to ingestion date when no file date is available. Does not certify a complete claims feed."
  - name: source_rx_freshness_date
    description: "Latest observed pharmacy file date for this source, falling back to ingestion date. A recent reload does not replace an available older file date."
  - name: source_clinical_lag_days
    description: "Days from the latest nonfuture dispensing observed in the source to the assessment date; independent of file ingestion time."
  - name: outreach_readiness_status
    description: "Review context for death, unconfirmed enrollment, missing or future source freshness, and lagged data. current_record_review is not confirmation of medication use or feed completeness."
  - name: condition_code
    description: "Stable analyst-facing code from the versioned condition rule seed."
  - name: condition_name
    description: "Tuva condition grouper label used to identify the cohort."
  - name: last_condition_date
    description: "Most recent qualifying unresolved condition date in the configured lookback."
  - name: condition_freshness_date
    description: "Latest condition evidence file date, falling back to condition ingestion date."
  - name: unknown_duration_flag
    description: "1 when recent condition-related medication evidence has unusable duration and prevents a confident absence-of-supply assessment."
  - name: recent_unmapped_drug_flag
    description: "1 when recent patient pharmacy evidence cannot be mapped to CodeRx; absence-of-treatment conclusions remain uncertain."
  - name: maintenance_fill_dates
    description: "Distinct qualifying maintenance dispensing dates within the refill history window. Refill authorizations do not add dispensing dates."
  - name: maintenance_supply_end_date
    description: "Latest inclusive usable maintenance supply end that determines the condition-level refill due date."
  - name: estimated_refill_due_date
    description: "Day after maintenance_supply_end_date. The linked maintenance medication identifies the fill supporting this date."
  - name: days_overdue
    description: "Assessment date minus estimated refill due date; negative is due soon, zero is due today, positive is overdue."
  - name: gap_status
    description: "Explains known active supply, a potential open gap, inability to assess, or exclusion for known death."
  - name: gap_history
    description: "Distinguishes no prior qualifying claim from prior treatment without current supply for flagged gaps."
  - name: treatment_evidence_file_date
    description: "File date of the maintenance fill supporting the refill due date."
  - name: treatment_evidence_ingest_datetime
    description: "Ingestion timestamp of the maintenance fill supporting the refill due date."
- name: drugs__open_drug_gap
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: 'Enterprise-only potential current gaps: recent condition evidence
    and no known active qualifying supply. Unknown exposure is excluded. Empty
    under Open means the workflow is unavailable, not that the population has no gaps.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - condition_status_id
  columns:
  - name: condition_status_id
    description: "Links to condition_status for the complete assessment and to the corresponding condition and medication evidence."
    data_tests:
    - not_null
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: patient_rx_freshness_date
    description: "Latest observed patient pharmacy file date, falling back to ingestion date when no file date is available. Does not certify a complete claims feed."
  - name: source_rx_freshness_date
    description: "Latest observed pharmacy file date for this source, falling back to ingestion date. A recent reload does not replace an available older file date."
  - name: source_clinical_lag_days
    description: "Days from the latest nonfuture dispensing observed in the source to the assessment date; independent of file ingestion time."
  - name: outreach_readiness_status
    description: "Review context for death, unconfirmed enrollment, missing or future source freshness, and lagged data. current_record_review is not confirmation of medication use or feed completeness."
  - name: condition_name
    description: "Condition with a potential absence of any related current medication supply."
  - name: open_drug_gap_flag
    description: "Always 1 in this worklist. Unknown assessments remain in condition_status and are excluded here."
  - name: condition_freshness_date
    description: "Condition evidence file date, falling back to ingestion date; review alongside pharmacy freshness."
  - name: gap_history
    description: "Whether the patient has no prior qualifying claim or prior treatment with no current estimated supply."
- name: drugs__needs_refill
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Enterprise-only condition-level refill review for repeated
    maintenance fills due soon or recently overdue, excluding uncertain exposure.
    Empty under Open means the workflow requires Enterprise.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - condition_status_id
  columns:
  - name: condition_status_id
    description: "Links to condition_status for the full assessment. This is a condition-level, not medication-regimen-component, worklist."
    data_tests:
    - not_null
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: patient_rx_freshness_date
    description: "Latest observed patient pharmacy file date, falling back to ingestion date when no file date is available. Does not certify a complete claims feed."
  - name: source_rx_freshness_date
    description: "Latest observed pharmacy file date for this source, falling back to ingestion date. A recent reload does not replace an available older file date."
  - name: source_clinical_lag_days
    description: "Days from the latest nonfuture dispensing observed in the source to the assessment date; independent of file ingestion time."
  - name: outreach_readiness_status
    description: "Review context for death, unconfirmed enrollment, missing or future source freshness, and lagged data. current_record_review is not confirmation of medication use or feed completeness."
  - name: condition_name
    description: "Condition with repeated maintenance fill evidence and a potential refill due within the configured window."
  - name: needs_refill_flag
    description: "Always 1 in this worklist. Unknown assessments remain in condition_status and are excluded here."
  - name: refill_status
    description: "due_soon for a future due date, due_today for assessment_date, or overdue for a recent past due date."
  - name: estimated_refill_due_date
    description: "Day after the latest usable maintenance supply ends."
  - name: days_overdue
    description: "Assessment date minus the estimated due date. Negative values are days until the refill is due."
  - name: maintenance_fill_dates
    description: "Number of distinct maintenance dispensing dates supporting an established treatment pattern; default minimum two."
  - name: latest_maintenance_medication_id
    description: "Usable maintenance fill whose supply end drives the due date. Join to medication by this ID and data_source."
  - name: latest_maintenance_drug_name
    description: "Name of the medication associated with the refill due date, not necessarily the most recently dispensed drug."
  - name: active_maintenance_supply_flag
    description: "Current usable maintenance supply. Respiratory rescue-only supply does not suppress an overdue controller refill."
  - name: treatment_evidence_file_date
    description: "Source-file date of the maintenance fill supporting the due date."
  - name: treatment_evidence_ingest_datetime
    description: "Ingestion timestamp of the maintenance fill supporting the due date."
  - name: recommendation_basis
    description: "Explicit potential-refill label requiring confirmation of the ongoing prescription and scheduled use."
- name: drugs__generic_alternative
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Active catalog generic NDCs grouped by exact clinical drug. Optional
    Enterprise screening restricts known categories to ANDA and respects known
    marketing dates; a missing category retains baseline status checks.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - generic_ndc_code
  columns:
  - name: generic_ndc_code
    description: "Active, prescribable generic package NDC. Multiple NDC alternatives may share a clinical product."
    data_tests:
    - not_null
  - name: generic_screening_basis
    description: active_product_flags for baseline status checks, or enterprise_marketing_metadata
      when paid regulatory category and marketing dates are also applied.
  - name: enterprise_marketing_enabled_flag
    description: 1 when Enterprise marketing metadata is available and enabled.
  - name: marketing_screening_applied_flag
    description: 1 when this generic alternative was screened using Enterprise marketing metadata.
  - name: clinical_drug_id
    description: "Exact CodeRx clinical product used to match brand and generic ingredient, strength and dosage form."
  - name: clinical_drug_name
    description: "Name of the matching clinical product, not a certification of therapeutic equivalence."
  - name: alternative_basis
    description: "Explains whether the catalog match used baseline active nonbrand status or known ANDA marketing category."
- name: drugs__brand_generic_opportunity
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: One current brand per source/person/clinical product, with availability
    separate from priceability and additive prospective payer-paid savings.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - opportunity_id
  columns:
  - name: opportunity_id
    description: "Unique current source, patient and branded clinical-product opportunity."
    data_tests:
    - not_null
  - name: brand_screening_basis
    description: brand_flag for the baseline, or enterprise_nda_category when paid
      regulatory category screening is applied to the current brand.
  - name: generic_screening_basis
    description: Screening used for the available catalog alternatives; mixed_screening_basis
      identifies alternatives with different screening bases.
  - name: marketing_screening_applied_flag
    description: 1 only when the brand and all catalog alternatives used paid
      Enterprise marketing screening. This is not a therapeutic-equivalence determination.
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
  - name: person_id
    description: "Patient identifier within data_source; not a cross-source person match."
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: patient_rx_freshness_date
    description: "Latest observed patient pharmacy file date, falling back to ingestion date when no file date is available. Does not certify a complete claims feed."
  - name: source_rx_freshness_date
    description: "Latest observed pharmacy file date for this source, falling back to ingestion date. A recent reload does not replace an available older file date."
  - name: source_clinical_lag_days
    description: "Days from the latest nonfuture dispensing observed in the source to the assessment date; independent of file ingestion time."
  - name: outreach_readiness_status
    description: "Review context for death, unconfirmed enrollment, missing or future source freshness, and lagged data. current_record_review is not confirmation of medication use or feed completeness."
  - name: drug_name
    description: "Name of the current branded product selected from usable active supply."
  - name: clinical_drug_id
    description: "Same ingredient, strength and dosage-form product used to find generic alternatives and comparable claims."
  - name: brand_ndc_code
    description: "Package NDC on the selected current branded fill."
  - name: generic_alternative_name
    description: "Name of the matching generic clinical product. Candidate NDCs are listed separately in generic_alternative."
  - name: generic_available_flag
    description: "1 when at least one eligible catalog generic exists; independent of observed generic claims or prices."
  - name: generic_ndc_count
    description: "Count of catalog NDC alternatives. Do not multiply parent opportunity savings by this count."
  - name: paid_amount
    description: "Payer-paid amount on the selected brand fill; no allowed or patient-paid financials are used."
  - name: pricing_status
    description: "Separates no_catalog_generic, unpriced_brand, insufficient_paid_benchmark, and priced_for_review."
  - name: benchmark_claim_count
    description: "Comparable positive payer-paid generic claims in the benchmark window; default minimum three."
  - name: benchmark_person_count
    description: "Distinct source-scoped generic patients in the benchmark; default minimum two."
  - name: generic_paid_per_unit
    description: "Median generic payer-paid price per unit among comparable source, payer, plan, clinical-product and utilization claims."
  - name: brand_paid_per_30_days
    description: "Brand payer-paid amount normalized to 30 days of the current fill."
  - name: generic_paid_per_30_days
    description: "Estimated generic payer-paid amount for 30 days at current brand utilization."
  - name: estimated_savings_per_30_days
    description: "Nonnegative difference between brand and estimated generic payer-paid cost per 30 days; null when unpriced."
  - name: estimated_annual_savings
    description: "Prospective nonnegative daily savings multiplied by 365. Assumes continued treatment and current prices; null when unpriced."
  - name: brand_file_date
    description: "Source-file date of the current branded fill used for price and supply evidence."
  - name: benchmark_file_date
    description: "Latest source-file date among comparable generic benchmark claims."
  - name: savings_basis
    description: "States the full-year continuation and price assumptions and need for equivalence and coverage review."
