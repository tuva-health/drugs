- name: drugs__condition_summary
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Enterprise-only source-scoped condition counts that reconcile to
    patient drilldowns. Empty under Open; capability status distinguishes an
    unavailable workflow from a population with no review candidates.
  columns:
  - name: refill_denominator_patients
    description: Living patients with qualifying condition evidence in a source with
      an observed pharmacy feed. Includes patients without prior fills and those
      with uncertain exposure; differs from assessed_patients.
  - name: percent_needing_refill
    description: 100 times patients_needing_refill divided by refill_denominator_patients,
      rounded to two decimals; null for a zero denominator. Sum counts before
      recalculating this percentage across sources.
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: condition_code
    description: "Stable configured condition code used to join summary counts to patient worklists."
  - name: condition_name
    description: "Tuva condition grouper label for the summary row."
  - name: assessed_patients
    description: "All condition_status rows for this source and condition, including excluded and unassessable patients. Not the refill denominator."
  - name: patients_with_open_gaps
    description: "Number of patients with open_drug_gap_flag = 1; reconciles to open_drug_gap."
  - name: patients_needing_refill
    description: "Number of patients with needs_refill_flag = 1; reconciles to needs_refill."
  - name: gap_unassessable_patients
    description: "Patients whose gap flag is null because medication exposure or the pharmacy feed cannot be assessed."
  - name: refill_unassessable_patients
    description: "Patients whose refill flag is null because exposure or the pharmacy feed cannot be assessed. They are not asserted to need a refill."
  - name: current_record_gap_patients
    description: "Gap candidates whose outreach_readiness_status is current_record_review; still require clinical review."
  - name: current_record_refill_patients
    description: "Refill candidates whose outreach_readiness_status is current_record_review; still require clinical review."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
        - condition_code
- name: drugs__brand_generic_summary
  config:
    schema: |
      {%- if var('tuva_schema_prefix', none) is not none and (var('tuva_schema_prefix') | trim) != '' -%}{{ var('tuva_schema_prefix') | trim }}_drugs{% else %}drugs{%- endif -%}
  description: Switchable patients and priced/all-patient annual savings by brand
    and generic clinical product.
  columns:
  - name: brand_screening_basis
    description: Screening basis shared by current brand opportunities, or mixed_screening_basis.
  - name: generic_screening_basis
    description: Screening basis shared by generic alternatives, or mixed_screening_basis.
  - name: marketing_screening_applied_flag
    description: 1 only when every underlying opportunity used Enterprise marketing
      screening for both the brand and all catalog alternatives.
  - name: data_source
    description: "Source component of patient and claim identity. Joins and counts remain source-scoped."
  - name: assessment_date
    description: "Clinical assessment date from drugs_as_of_date, defaulting to the warehouse date when the mart is built. This is not a historical warehouse snapshot."
  - name: brand_drug
    description: "Current branded drug name for the summarized clinical-product opportunities."
  - name: clinical_drug_id
    description: "CodeRx clinical product shared by the brand and generic alternatives."
  - name: generic_alternative
    description: "Generic clinical-product name; multiple package NDCs do not multiply patient counts or savings."
  - name: patients_who_could_switch
    description: "Current source-scoped brand users with an eligible catalog generic, subject to clinical and coverage review."
  - name: patients_with_savings_estimate
    description: "Candidates whose pricing_status is priced_for_review, including supported estimates of zero savings."
  - name: patients_without_savings_estimate
    description: "Candidates without a supported savings estimate. Missing savings is not zero savings."
  - name: patients_with_positive_estimated_savings
    description: "Priced candidates with estimated annual savings greater than zero."
  - name: annual_savings_for_priced_patients
    description: "Sum of supported patient annual savings. An explicitly partial subtotal when any candidates are unpriced."
  - name: annual_savings_if_all_switched
    description: "Full-cohort sum only when every candidate is priced; null when at least one candidate lacks an estimate."
  - name: savings_coverage_status
    description: "all_patients_priced or incomplete_pricing; distinguishes a full-cohort estimate from a partial subtotal."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - data_source
        - brand_drug
        - clinical_drug_id
