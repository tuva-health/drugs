version: 2
unit_tests:
- name: condition_exact_levels_all_memberships_and_direct_precedence
  model: drugs__drug_condition
  overrides:
    vars:
      drugs_as_of_date: '2026-11-11'
      use_coderx_enterprise: false
      drugs_refill_min_fills: 2
      drugs_refill_lookahead_days: 7
      drugs_refill_max_overdue_days: 30
  given:
  - input: ref('drugs__stg_drugs')
    format: sql
    rows: 'select cast(''generic'' as varchar) as drug_id, cast(''generic'' as varchar) as clinical_drug_id

      union all

      select cast(''brand'' as varchar) as drug_id, cast(''generic'' as varchar) as clinical_drug_id

      union all

      select cast(''direct'' as varchar) as drug_id, cast(''generic'' as varchar) as clinical_drug_id

      union all

      select cast(''multi'' as varchar) as drug_id, cast(''generic'' as varchar) as clinical_drug_id

      union all

      select cast(''no_prefix'' as varchar) as drug_id, cast(''generic'' as varchar) as clinical_drug_id'
  - input: ref('drugs__stg_classes')
    format: sql
    rows: 'select cast(''generic'' as varchar) as drug_id, cast(''A'' as varchar) as atc_1_code, cast(''A10'' as
      varchar) as atc_2_code, cast(''A10B'' as varchar) as atc_3_code, cast(''A10BA'' as varchar) as atc_4_code

      union all

      select cast(''generic'' as varchar) as drug_id, cast(''A'' as varchar) as atc_1_code, cast(''A10'' as varchar)
      as atc_2_code, cast(''A10B'' as varchar) as atc_3_code, cast(''A10BA'' as varchar) as atc_4_code

      union all

      select cast(''direct'' as varchar) as drug_id, cast(''C'' as varchar) as atc_1_code, cast(''C10'' as varchar)
      as atc_2_code, cast(''C10A'' as varchar) as atc_3_code, cast(''C10AA'' as varchar) as atc_4_code

      union all

      select cast(''multi'' as varchar) as drug_id, cast(''C'' as varchar) as atc_1_code, cast(''C10'' as varchar)
      as atc_2_code, cast(''C10A'' as varchar) as atc_3_code, cast(''C10AA'' as varchar) as atc_4_code

      union all

      select cast(''multi'' as varchar) as drug_id, cast(''C'' as varchar) as atc_1_code, cast(''C10'' as varchar)
      as atc_2_code, cast(''C10B'' as varchar) as atc_3_code, cast(''C10BA'' as varchar) as atc_4_code

      union all

      select cast(''no_prefix'' as varchar) as drug_id, cast(''A'' as varchar) as atc_1_code, cast(''A11'' as varchar)
      as atc_2_code, cast(''A11A'' as varchar) as atc_3_code, cast(''A10BA'' as varchar) as atc_4_code'
  - input: ref('drugs__condition_rule')
    format: sql
    rows: 'select cast(1 as integer) as rule_id, cast(''t2d'' as varchar) as condition_code, cast(''Type 2 Diabetes
      Mellitus'' as varchar) as condition_name, cast(''Fixture'' as varchar) as condition_family, cast(''A10'' as
      varchar) as atc_code, cast(2 as integer) as atc_level, cast(''qualifying'' as varchar) as evidence_strength,
      cast(1 as integer) as gap_eligible_flag, cast(1 as integer) as refill_eligible_flag, cast(0 as integer) as
      refill_possible_flag

      union all

      select cast(2 as integer) as rule_id, cast(''cad'' as varchar) as condition_code, cast(''Coronary Artery Disease''
      as varchar) as condition_name, cast(''Fixture'' as varchar) as condition_family, cast(''C10AA'' as varchar)
      as atc_code, cast(4 as integer) as atc_level, cast(''possible'' as varchar) as evidence_strength, cast(1 as
      integer) as gap_eligible_flag, cast(1 as integer) as refill_eligible_flag, cast(1 as integer) as refill_possible_flag

      union all

      select cast(3 as integer) as rule_id, cast(''cad'' as varchar) as condition_code, cast(''Coronary Artery Disease''
      as varchar) as condition_name, cast(''Fixture'' as varchar) as condition_family, cast(''C10BA'' as varchar)
      as atc_code, cast(4 as integer) as atc_level, cast(''qualifying'' as varchar) as evidence_strength, cast(1
      as integer) as gap_eligible_flag, cast(1 as integer) as refill_eligible_flag, cast(0 as integer) as refill_possible_flag'
  expect:
    rows:
    - drug_id: generic
      condition_code: t2d
      qualifying_class_flag: 1
      possible_class_flag: 0
      refill_eligible_flag: 1
      refill_qualifying_class_flag: 1
    - drug_id: brand
      condition_code: t2d
      qualifying_class_flag: 1
      possible_class_flag: 0
      refill_eligible_flag: 1
      refill_qualifying_class_flag: 1
    - drug_id: direct
      condition_code: cad
      qualifying_class_flag: 0
      possible_class_flag: 1
      refill_eligible_flag: 1
      refill_qualifying_class_flag: 0
    - drug_id: multi
      condition_code: cad
      qualifying_class_flag: 1
      possible_class_flag: 1
      refill_eligible_flag: 1
      refill_qualifying_class_flag: 1
- name: condition_annual_window_includes_resolved_and_onset_fallback
  model: drugs__condition_evidence
  overrides:
    vars:
      drugs_as_of_date: '2026-11-11'
      use_coderx_enterprise: false
      drugs_refill_min_fills: 2
      drugs_refill_lookahead_days: 7
      drugs_refill_max_overdue_days: 30
  given:
  - input: ref('core__condition')
    format: sql
    rows: 'select cast(''first'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as
      varchar) as data_source, cast(''claim'' as varchar) as claim_id, cast(''Asthma'' as varchar) as condition_name,
      cast(''Respiratory'' as varchar) as condition_family, cast(''2025-11-12'' as date) as recorded_date, cast(null
      as date) as onset_date, cast(null as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system,
      cast(''J45'' as varchar) as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp)
      as ingest_datetime

      union all

      select cast(''before'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''claim'' as varchar) as claim_id, cast(''Asthma'' as varchar) as condition_name, cast(''Respiratory''
      as varchar) as condition_family, cast(''2025-11-11'' as date) as recorded_date, cast(null as date) as onset_date,
      cast(null as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system, cast(''J45'' as varchar)
      as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''today'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''claim'' as varchar) as claim_id, cast(''Asthma'' as varchar) as condition_name, cast(''Respiratory''
      as varchar) as condition_family, cast(''2026-11-11'' as date) as recorded_date, cast(null as date) as onset_date,
      cast(null as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system, cast(''J45'' as varchar)
      as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''future'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''claim'' as varchar) as claim_id, cast(''Asthma'' as varchar) as condition_name, cast(''Respiratory''
      as varchar) as condition_family, cast(''2026-11-12'' as date) as recorded_date, cast(null as date) as onset_date,
      cast(null as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system, cast(''J45'' as varchar)
      as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''resolved'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''claim'' as varchar) as claim_id, cast(''Asthma'' as varchar) as condition_name, cast(''Respiratory''
      as varchar) as condition_family, cast(''2026-04-01'' as date) as recorded_date, cast(null as date) as onset_date,
      cast(''2026-05-01'' as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system, cast(''J45''
      as varchar) as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''onset'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''claim'' as varchar) as claim_id, cast(''Asthma'' as varchar) as condition_name, cast(''Respiratory''
      as varchar) as condition_family, cast(null as date) as recorded_date, cast(''2026-01-01'' as date) as onset_date,
      cast(null as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system, cast(''J45'' as varchar)
      as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''outside'' as varchar) as condition_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''claim'' as varchar) as claim_id, cast(''Not included'' as varchar) as condition_name,
      cast(''Respiratory'' as varchar) as condition_family, cast(''2026-11-11'' as date) as recorded_date, cast(null
      as date) as onset_date, cast(null as date) as resolved_date, cast(''icd-10-cm'' as varchar) as code_system,
      cast(''J45'' as varchar) as normalized_code, cast(''J45'' as varchar) as source_code, cast(null as timestamp)
      as ingest_datetime'
  - input: ref('drugs__medical_claim_lineage')
    format: sql
    rows: select cast('p' as varchar) as person_id, cast('b' as varchar) as data_source, cast('claim' as varchar)
      as claim_id, cast('2026-11-11' as date) as file_date, cast('2026-11-11 00:00:00' as timestamp) as ingest_datetime
  - input: ref('drugs__condition_rule')
    format: sql
    rows: select cast(1 as integer) as rule_id, cast('asthma' as varchar) as condition_code, cast('Asthma' as varchar)
      as condition_name, cast('Fixture' as varchar) as condition_family, cast('R03BA' as varchar) as atc_code, cast(4
      as integer) as atc_level, cast('qualifying' as varchar) as evidence_strength, cast(1 as integer) as gap_eligible_flag,
      cast(0 as integer) as refill_eligible_flag, cast(0 as integer) as refill_possible_flag
  expect:
    rows:
    - condition_id: first
      file_date: null
      ingest_datetime: null
      freshness_lineage: unavailable
    - condition_id: today
      file_date: null
      ingest_datetime: null
      freshness_lineage: unavailable
    - condition_id: resolved
      file_date: null
      ingest_datetime: null
      freshness_lineage: unavailable
    - condition_id: onset
      file_date: null
      ingest_datetime: null
      freshness_lineage: unavailable
- name: annual_medication_events_ignore_supply_and_current_activity
  model: drugs__medication_condition
  overrides:
    vars:
      drugs_as_of_date: '2026-11-11'
      use_coderx_enterprise: false
      drugs_refill_min_fills: 2
      drugs_refill_lookahead_days: 7
      drugs_refill_max_overdue_days: 30
  given:
  - input: ref('drugs__medication')
    format: sql
    rows: 'select cast(''first'' as varchar) as medication_id, cast(''p'' as varchar) as person_id, cast(''a'' as
      varchar) as data_source, cast(''therapy'' as varchar) as therapy_id, cast(''drug'' as varchar) as drug_id,
      cast(''drug'' as varchar) as drug_name, cast(null as varchar) as clinical_drug_id, cast(''2025-11-12'' as
      date) as dispensing_date, cast(null as integer) as days_supply, cast(''missing_days_supply'' as varchar) as
      exposure_status, cast(null as date) as file_date, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''before'' as varchar) as medication_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''therapy'' as varchar) as therapy_id, cast(''drug'' as varchar) as drug_id, cast(''drug''
      as varchar) as drug_name, cast(null as varchar) as clinical_drug_id, cast(''2025-11-11'' as date) as dispensing_date,
      cast(30 as integer) as days_supply, cast(''missing_days_supply'' as varchar) as exposure_status, cast(null
      as date) as file_date, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''today'' as varchar) as medication_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''therapy'' as varchar) as therapy_id, cast(''drug'' as varchar) as drug_id, cast(''drug''
      as varchar) as drug_name, cast(null as varchar) as clinical_drug_id, cast(''2026-11-11'' as date) as dispensing_date,
      cast(-1 as integer) as days_supply, cast(''missing_days_supply'' as varchar) as exposure_status, cast(null
      as date) as file_date, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''future'' as varchar) as medication_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''therapy'' as varchar) as therapy_id, cast(''drug'' as varchar) as drug_id, cast(''drug''
      as varchar) as drug_name, cast(null as varchar) as clinical_drug_id, cast(''2026-11-12'' as date) as dispensing_date,
      cast(30 as integer) as days_supply, cast(''missing_days_supply'' as varchar) as exposure_status, cast(null
      as date) as file_date, cast(null as timestamp) as ingest_datetime

      union all

      select cast(''undated'' as varchar) as medication_id, cast(''p'' as varchar) as person_id, cast(''a'' as varchar)
      as data_source, cast(''therapy'' as varchar) as therapy_id, cast(''drug'' as varchar) as drug_id, cast(''drug''
      as varchar) as drug_name, cast(null as varchar) as clinical_drug_id, cast(null as date) as dispensing_date,
      cast(30 as integer) as days_supply, cast(''missing_days_supply'' as varchar) as exposure_status, cast(null
      as date) as file_date, cast(null as timestamp) as ingest_datetime'
  - input: ref('drugs__drug_condition')
    format: sql
    rows: select cast('drug' as varchar) as drug_id, cast('t2d' as varchar) as condition_code, cast('Type 2 Diabetes
      Mellitus' as varchar) as condition_name, cast(null as varchar) as condition_family, cast(null as integer)
      as evidence_rule_id, cast(null as varchar) as evidence_atc_4_code, cast('qualifying' as varchar) as evidence_strength,
      cast(1 as integer) as qualifying_class_flag, cast(0 as integer) as possible_class_flag, cast(1 as integer)
      as refill_eligible_flag, cast(0 as integer) as refill_possible_flag, cast(1 as integer) as refill_qualifying_class_flag
  - input: ref('drugs__fill')
    format: sql
    rows: select cast(null as varchar) as person_id, cast(null as varchar) as data_source, cast(null as varchar)
      as medication_id, cast(null as date) as supply_start_date, cast(null as date) as supply_end_date where 1=0
  expect:
    rows:
    - medication_id: first
      active_supply_flag: 0
      qualifying_class_flag: 1
    - medication_id: today
      active_supply_flag: 0
      qualifying_class_flag: 1
