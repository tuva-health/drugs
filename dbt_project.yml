name: drugs
version: 1.0.0
config-version: 2
require-dbt-version:
- '>=1.10.5'
- <2.0.0
profile: default
model-paths:
- models
macro-paths:
- macros
seed-paths:
- seeds
test-paths:
- tests
analysis-paths:
- analyses
clean-targets:
- target
- dbt_packages
vars:
  use_coderx_enterprise: false
  drugs_enable_enterprise_enrichment: true
  drugs_data_asset_version: '1.0.0'
  drugs_as_of_date: null
  drugs_episode_gap_days: 30
  drugs_stockpile_early_refills: false
  drugs_condition_lookback_days: 365
  drugs_uncertain_exposure_days: 365
  drugs_refill_lookahead_days: 7
  drugs_refill_max_overdue_days: 30
  drugs_refill_min_fills: 2
  drugs_freshness_days: 45
  drugs_generic_lookback_days: 90
  drugs_generic_min_claims: 3
  drugs_generic_min_people: 2
models:
  drugs:
    +materialized: table
    +tags:
    - drugs
    staging:
      +materialized: view
seeds:
  drugs:
    drugs__rxnorm_drug_ingredient:
      +post-hook: "{{ the_tuva_project.load_package_seed('data-marts/drugs', var('drugs_data_asset_version'), 'drugs__rxnorm_drug_ingredient.csv.gz') }}"
on-run-start:
- '{{ drugs_validate_config() }}'
