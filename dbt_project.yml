name: drugs
version: 0.1.0
config-version: 2
require-dbt-version:
- '>=1.10.5'
- <2.0.0
profile: drugs
model-paths:
- models
macro-paths:
- macros
seed-paths:
- seeds
test-paths:
- tests
analysis-paths:
- analyses
clean-targets:
- target
- dbt_packages
vars:
  use_coderx_enterprise: false
  drugs_core_schema: core
  drugs_terminology_schema: terminology
  drugs_coderx_schema: terminology
  drugs_coderx_table_prefix: coderx_enterprise_
  drugs_as_of_date: null
  drugs_episode_gap_days: 30
  drugs_stockpile_early_refills: false
  drugs_condition_lookback_days: 365
  drugs_uncertain_exposure_days: 365
  drugs_refill_lookahead_days: 7
  drugs_refill_max_overdue_days: 30
  drugs_refill_min_fills: 2
  drugs_freshness_days: 45
  drugs_generic_lookback_days: 90
  drugs_generic_min_claims: 3
  drugs_generic_min_people: 2
models:
  drugs:
    +materialized: table
    +tags:
    - drugs
    staging:
      +materialized: view
on-run-start:
- '{{ drugs_validate_config() }}'
