name: Parse dbt package
on: [push, pull_request]
jobs:
  parse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        enterprise: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-databricks.txt
      - run: dbt deps
      - run: >-
          dbt parse --no-partial-parse --profiles-dir ci --vars '{"use_coderx_enterprise": ${{ matrix.enterprise }}}'
